<div class="mx-auto max-w-2xl space-y-6 p-10 text-center">
  <h1 class="text-3xl font-bold text-gray-900">{{ 'landing.title' | transloco }}</h1>
  <p class="text-gray-600">{{ 'landing.subtitle' | transloco }}</p>
  @if (isAuthenticated()) {
    <a
      routerLink="/app"
      data-testid="landing-cta"
      class="inline-block rounded bg-blue-600 px-6 py-3 font-medium text-white"
    >
      {{ 'landing.cta' | transloco }}
    </a>
  } @else {
    <button
      type="button"
      data-testid="landing-cta"
      (click)="login()"
      class="inline-block rounded bg-blue-600 px-6 py-3 font-medium text-white"
    >
      {{ 'landing.cta' | transloco }}
    </button>
  }
</div>
