<ol class="flex w-full items-center gap-3" aria-label="Progrés">
  @for (step of steps; track step; let isLast = $last) {
    <li class="flex flex-1 items-center gap-3">
      <button
        type="button"
        (click)="onStepClick(step)"
        class="rounded-lg text-sm font-medium transition-colors duration-200 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-clay"
        [class]="stepState(step) === 'active' ? 'text-clay' : stepState(step) === 'done' ? 'text-ink' : 'text-ink/35'"
      >
        {{ 'stepper.' + step | transloco }}
      </button>
      @if (!isLast) {
        <span
          class="h-px flex-1 transition-colors duration-200"
          [class]="stepState(step) === 'done' ? 'bg-clay' : 'bg-line'"
        ></span>
      }
    </li>
  }
</ol>
